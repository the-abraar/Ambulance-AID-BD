# Run end to end on a laptop on 2026-10-14 (see docs/deploy.md); not yet run on a real host.
# Needs a .env next to this file; see .env.example. Caddy gets a TLS certificate for $DOMAIN automatically,
# so DNS for $DOMAIN must point at this host and ports 80/443 must be open (HTTPS is required for phone GPS).
# Every service: Docker logs rotated at 5 x 10 MB, and no privilege gain through setuid binaries (docs/deploy.md).
x-defaults: &defaults
  logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
  security_opt: [no-new-privileges:true]
services:
  db:  # keeps its default capabilities: the postgres entrypoint needs them to chown its data and drop to `postgres`
    <<: *defaults
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    restart: unless-stopped
    # Refuse the .env.example placeholders, short passwords, and characters that would break the postgresql:// URLs.
    entrypoint:
      - sh
      - -c
      - |
        for p in "$$POSTGRES_PASSWORD" "$$APP_DB_PASSWORD"; do
          case "$$p" in *change-me*|*[!A-Za-z0-9]*) echo "refusing to start: set real passwords in .env (openssl rand -hex 32)" >&2; exit 1;; esac
          [ $${#p} -ge 24 ] || { echo "refusing to start: passwords in .env must be at least 24 characters" >&2; exit 1; }
        done
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      POSTGRES_DB: ambulance
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ambulance"]
      interval: 5s
      retries: 10
  migrate:  # one-shot, as the owner: migrations, then least-privilege grants for the app role (ops/migrate.py)
    <<: *defaults
    cap_drop: [ALL]
    build: ./backend
    image: ambulance-aid-bd
    restart: "no"
    command: [python, /ops/migrate.py]
    environment:
      AMBULANCE_DB_PATH: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/ambulance
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PYTHONPATH: /srv
    volumes: [./ops:/ops:ro]
    depends_on:
      db: {condition: service_healthy}
  app:
    <<: *defaults
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 200
    build: ./backend
    image: ambulance-aid-bd
    restart: unless-stopped
    environment:
      AMBULANCE_DB_PATH: postgresql://ambulance_app:${APP_DB_PASSWORD}@db:5432/ambulance
      # Trust X-Forwarded-For (set by Caddy) so POST /pair limits per phone, not per proxy. "*" is safe only
      # because app publishes no port: only containers on this network reach it.
      FORWARDED_ALLOW_IPS: "*"
      AMBULANCE_SMS_API_KEY: ${AMBULANCE_SMS_API_KEY:-}  # both set = SMS fallback on; see backend/README.md
      AMBULANCE_SMS_SENDER_ID: ${AMBULANCE_SMS_SENDER_ID:-}
      AMBULANCE_DISPATCH_PHONE: ${AMBULANCE_DISPATCH_PHONE:-}  # desk number for the driver app's Call dispatch button
      AMBULANCE_ANDROID_CERT_SHA256: ${AMBULANCE_ANDROID_CERT_SHA256:-}  # release key; lets the pairing QR open the app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
  backup:  # nightly encrypted pg_dump into ./backups, deleted after 14 days (ops/backup.sh); restore with ops/restore.sh
    <<: *defaults  # runs as root (its entrypoint skips the image's drop to `postgres`), so default capabilities stay
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    restart: unless-stopped
    entrypoint: [bash, /ops/backup.sh]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ambulance
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
    volumes: [./ops:/ops:ro, ./backups:/backups]
    healthcheck:  # unhealthy when the newest dump is over 26 hours old: one missed night shows in `docker compose ps`
      test: [CMD-SHELL, "find /backups -maxdepth 1 -name 'ambulance-*.dump.gpg' -mmin -1560 | grep -q ."]
      interval: 10m
      start_period: 10m
      start_interval: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}  # so the first dump already has the schema
  offsite:  # only with COMPOSE_PROFILES=offsite: nightly copy of the encrypted dumps to BACKUP_OFFSITE (ops/offsite.sh)
    <<: *defaults
    cap_drop: [ALL]
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    profiles: [offsite]
    restart: unless-stopped
    entrypoint: [sh, /ops/offsite.sh]
    environment:
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
    volumes: [./ops:/ops:ro, ./backups:/backups:ro, ./rclone.conf:/config/rclone/rclone.conf:ro]
    healthcheck:  # unhealthy when the last good copy (ops/offsite.sh touches the file) is over 26 hours old
      test: [CMD-SHELL, "find /tmp/offsite-ok -mmin -1560 | grep -q ."]
      interval: 10m
      start_period: 10m
      start_interval: 10s
  caddy:
    <<: *defaults
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # ports 80 and 443
    read_only: true
    tmpfs: [/tmp, /config]  # /config holds only Caddy's autosaved copy of the Caddyfile; certificates live in /data
    mem_limit: 256m
    pids_limit: 200
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app: {condition: service_healthy}
volumes:
  pgdata:
  caddy_data:
