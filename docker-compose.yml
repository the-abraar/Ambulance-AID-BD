# UNTESTED: written without a running Docker daemon (only `docker compose config` was checked).
# Needs a .env next to this file; see .env.example. Caddy gets a TLS certificate for $DOMAIN automatically,
# so DNS for $DOMAIN must point at this host and ports 80/443 must be open (HTTPS is required for phone GPS).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ambulance
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ambulance"]
      interval: 5s
      retries: 10
  app:
    build: ./backend
    restart: unless-stopped
    environment:
      AMBULANCE_DB_PATH: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/ambulance
    depends_on:
      db: {condition: service_healthy}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  pgdata:
  caddy_data:
